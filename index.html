<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustPromot | Digital Solutions for Business Growth</title>
    <meta
      name="description"
      content="JustPromot provides professional website development, Google Business Profile services and engaging reel solutions to help businesses build a stronger online presence."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JustPromot | Digital Solutions for Business Growth" />
    <meta
      property="og:description"
      content="JustPromot provides professional website development, Google Business Profile services and engaging reel solutions to help businesses build a stronger online presence."
    />
    <meta property="og:site_name" content="JustPromot" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JustPromot | Digital Solutions for Business Growth" />
    <meta
      name="twitter:description"
      content="JustPromot provides professional website development, Google Business Profile services and engaging reel solutions to help businesses build a stronger online presence."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for LocalBusiness & ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "JustPromot",
        "description": "JustPromot provides professional website development, Google Business Profile services and engaging reel solutions to help businesses build a stronger online presence.",
        "email": "justpromot@gmail.com",
        "telephone": "+9182555869",
        "url": "https://justpromot.com",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Digital Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Website Development",
                "description": "Modern, responsive and business-focused websites designed to establish credibility and help businesses connect with their customers online."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Google Business Profile",
                "description": "Improve your local online presence and help customers discover your business through a properly optimized Google Business Profile."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Reel Services",
                "description": "Create engaging short-form videos designed to showcase your business, products, services and brand across social platforms."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
